<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nanling Daozang · Illustration Archive</title><style>
:root{color-scheme:dark;--bg:#0b1425;--panel:#14243a;--gold:#d8b96e;--text:#edf2f7;--muted:#a9b7c9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17314a,var(--bg) 55%);color:var(--text);font:16px system-ui,sans-serif;padding:clamp(16px,4vw,48px)}main{max-width:1280px;margin:auto}h1{font:clamp(28px,4vw,46px) Georgia,serif;color:var(--gold)}.sub{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;margin-top:28px}.card{background:var(--panel);border-radius:16px;overflow:hidden}.card img{display:block;width:100%;height:auto;aspect-ratio:16/10;object-fit:contain;background:#09111e;border:0}.card div{padding:14px}.card h2{font-size:18px;margin:0 0 6px}.card p{color:var(--muted);font-size:14px;margin:0}</style></head><body><main><h1>Nanling Daozang</h1><p class="sub">Illustration Archive · Science, technology and civilization</p><section id="gallery" class="grid">Memuat katalog…</section></main><script>
fetch("./catalog.json").then(r=>{if(!r.ok)throw Error("catalog unavailable");return r.json()}).then(data=>{const root=document.getElementById("gallery");root.textContent="";for(const item of(data.illustrations||[])){const card=document.createElement("article");card.className="card";const img=document.createElement("img");img.loading="lazy";img.src="./assets/"+encodeURIComponent(item.thumbnail);img.alt=item.alt||item.title||"Ilustrasi";const info=document.createElement("div");const h=document.createElement("h2");h.textContent=item.title||"Ilustrasi";const p=document.createElement("p");p.textContent=item.description||item.category||"";info.append(h,p);card.append(img,info);root.append(card)}if(!data.illustrations?.length)root.textContent="Belum ada ilustrasi. Jalankan generator terlebih dahulu."}).catch(()=>{document.getElementById("gallery").textContent="Katalog belum tersedia. Periksa GitHub Actions."});
</script></body></html>
